[package]
name = "graysondoc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "graysondoc"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
argh = "0.1.13"
chrono = "0.4.42"
env_logger = "0.11.8"
log = "0.4.28"
nom = "8.0.0"
serde = { version = "1.0.226", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
strum_macros = "0.27.2"
thiserror = "2.0.16"
toml = "0.9.6"
xxhash-rust = { version = "0.8.15", features = ["xxh3", "const_xxh3"] }

[dev-dependencies]
tempdir = "0.3.7"
similar-asserts = "1.7.0"

[profile.dev.package.similar]
opt-level = 3
